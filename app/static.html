<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Terminal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: #ffffff;
            font-family: monospace;
            overflow: hidden;
        }

        #terminal {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 5vh;
            box-sizing: border-box;
        }

        #output-container {
            flex: 1;
            overflow-y: auto;
        }

        pre {
            margin: 0;
            font-size: 3vh;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media (max-width: 768px) {
            #terminal {
                padding: 2vh;
                height: calc(var(--vh, 1vh) * 100);
            }
            pre {
                font-size: 4vh;
            }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div id="output-container">
            <pre id="output"></pre>
        </div>
    </div>

    <script>
        let resizeWindow = () => {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        };

        document.addEventListener('DOMContentLoaded', () => {
            window.addEventListener('resize', resizeWindow);
            resizeWindow();

            const socket = new WebSocket(`ws://${window.location.hostname}/`);
            const outputElement = document.getElementById('output');
            const outputContainer = document.getElementById('output-container');

            function displayMessage(message) {
                outputElement.textContent += message + '\n';
                outputContainer.scrollTop = outputContainer.scrollHeight;
            }

            function handleWebSocketError(errorEvent) {
                displayMessage(`< Error: ${errorEvent.message} >`);
            }

            function handleWebSocketOpen() {
                displayMessage(`< Connected to ${window.location.hostname} >`);
            }

            function formatAddress(hexString) {
                return hexString
                    .slice(0, 12)
                    .toUpperCase()
                    .match(/.{2}/g)
                    .join(':');
            }

            function fmtUInt(value, width) {
                return String(value).padStart(width, '0');
            }

            function fmtScaled(value, decimals) {
                return value.toFixed(decimals);
            }

            function decodeBTHomeMessage(hexString) {
                const address = formatAddress(hexString);
                const payloadHex = hexString.slice(18);

                const bytes = Uint8Array.fromHex(payloadHex);
                const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

                const status = { address };
                let i = 0;

                while (i < bytes.length) {
                    const objectID = bytes[i++];

                    switch (objectID) {
                        case 0x00: {
                            status.packet = fmtUInt(bytes[i], 3);
                            i += 1;
                            break;
                        }
                        case 0x01: {
                            status.battery = fmtUInt(bytes[i], 2);
                            i += 1;
                            break;
                        }
                        case 0x02: {
                            const value = view.getInt16(i, true);
                            status.temperature = fmtScaled(value * 0.01, 2);
                            i += 2;
                            break;
                        }
                        case 0x03: {
                            const value = view.getUint16(i, true);
                            status.humidity = fmtScaled(value * 0.01, 2);
                            i += 2;
                            break;
                        }
                        case 0x0C: {
                            const value = view.getUint16(i, true);
                            status.voltage = fmtScaled(value * 0.001, 3);
                            i += 2;
                            break;
                        }
                        default:
                            throw new Error(`unsupported object ID: 0x${objectID.toString(16).toUpperCase()}`);
                    }
                }

                return status;
            }

            socket.addEventListener('message', (event) => {
                const decoded = decodeBTHomeMessage(String(event.data));
                displayMessage(
                    Object.entries(decoded)
                        .map(([k, v]) => `${k}=${v}`)
                        .join(' ')
                );
            });

            socket.addEventListener('error', handleWebSocketError);
            socket.addEventListener('open', handleWebSocketOpen);
        });
    </script>
</body>
</html>
